name: zhejiao_app
description: "折角 · NowenReader 客户端"
publish_to: 'none'
version: 0.2.3+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^1.16.1
  material_color_utilities: ^0.13.0
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  pdfrx: '>=2.4.5 <2.5.0'
  crypto: ^3.0.7
  intl: ^0.20.2
  timeago: ^3.6.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.5
  file_picker: ^8.0.0
  package_info_plus: ^9.0.1
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
