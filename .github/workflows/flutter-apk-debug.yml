name: Debug APK

on:
  workflow_dispatch:
  push:
    branches: [sync/upstream-deploy]
    paths:
      - '.github/workflows/flutter-apk-debug.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use a side-by-side test package id
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('flutter_app/android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          marker = '    buildTypes {\n        release {'
          assert marker in text
          text = text.replace(marker, '    buildTypes {\n        debug {\n            applicationIdSuffix = ".qadev"\n            versionNameSuffix = "-qadev"\n        }\n        release {')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug
      - name: Publish APK branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp flutter_app/build/app/outputs/flutter-apk/app-debug.apk ./nowen-reader-qadev.apk
          git add -f nowen-reader-qadev.apk
          git commit -m "ci: debug apk ${GITHUB_SHA::7}"
          git push --force origin HEAD:ci-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nowen-reader-qadev-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
